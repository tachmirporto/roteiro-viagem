<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Roteiro Detalhado — 1 Ano pelo Mundo</title>
<style>
:root{--bg:#0e0f11;--surf:#16181c;--surf2:#1e2026;--surf3:#24272e;--bd:#2a2d35;--tx:#e8eaf0;--mut:#7a7f8e;--dim:#4a4f5e;--ok:#00d4aa;--okd:rgba(0,212,170,.12);--ac2:#6c8eff;--ac2d:rgba(108,142,255,.12);--warn:#ffb84d;--warnd:rgba(255,184,77,.12);--bad:#ff6b6b;--badd:rgba(255,107,107,.12);--r:10px;--rs:6px;--f:'Space Grotesk',sans-serif;--m:'Space Mono',monospace}
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font-family:var(--f);font-size:14px;line-height:1.6}
.hd{background:var(--surf);border-bottom:1px solid var(--bd);padding:16px 24px;display:flex;gap:16px;align-items:center;position:sticky;top:0;z-index:100}
.hd .t{font-family:var(--m);font-size:13px;color:var(--ok);letter-spacing:.08em;text-transform:uppercase}

.tab{background:none;border:none;color:var(--mut);font-family:var(--f);font-size:13px;font-weight:500;padding:12px 18px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tab:hover{color:var(--tx)}.tab.on{color:var(--ok);border-bottom-color:var(--ok)}
.pg{display:none;padding:24px;max-width:1100px;margin:0 auto}
.pg.on{display:block}
.cnt{background:var(--surf);border:1px solid var(--bd);border-radius:var(--r);padding:18px 24px;margin-bottom:24px;display:flex;align-items:center;gap:32px;flex-wrap:wrap}

.colhd{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--tx);font-weight:700;padding:10px 4px;border-bottom:2px solid var(--bd);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.colhd .tot{margin-left:auto;font-family:var(--m);color:var(--ok)}
@media(max-width:900px){.cols2{grid-template-columns:1fr}}
.cmp{display:flex;align-items:center;gap:8px;margin-top:6px;padding:0 20px 10px}
.cmp .cmp-bar{flex:1;height:5px;background:var(--bd);border-radius:99px;overflow:hidden}
.cmp .cmp-fill{height:100%;border-radius:99px;background:var(--ok)}
.cmp .cmp-fill.w{background:var(--warn)}.cmp .cmp-fill.d{background:var(--bad)}
.cmp .cmp-txt{font-family:var(--m);font-size:11px;color:var(--mut);white-space:nowrap}
.gform{display:flex;gap:8px;padding:10px 20px;flex-wrap:wrap;align-items:center}
.gform select,.gform input{background:var(--surf2);border:1px solid var(--bd);color:var(--tx);padding:7px 9px;border-radius:var(--rs);font-family:var(--f);font-size:12px}

.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:99px;font-size:11px;font-weight:600}
.p-ok{background:var(--okd);color:var(--ok)}.p-ac2{background:var(--ac2d);color:var(--ac2)}.p-warn{background:var(--warnd);color:var(--warn)}
.tg{padding:3px 10px;border-radius:99px;font-size:11px;font-weight:600}
.tg-eu{background:rgba(108,142,255,.15);color:#6c8eff}.tg-om{background:rgba(255,184,77,.15);color:#ffb84d}
.tg-as{background:rgba(255,126,179,.15);color:#ff7eb3}.tg-hs{background:rgba(0,212,170,.15);color:#00d4aa}.tg-buf{background:rgba(155,143,255,.15);color:#9b8fff}

.acc-h.on{border-bottom-left-radius:0;border-bottom-right-radius:0;border-bottom-color:transparent}
.acc-h .nm{font-family:var(--m);font-size:13px;font-weight:700;min-width:90px}
.acc-h .sum{font-size:12px;color:var(--mut);flex:1}
.acc-h .tot{font-family:var(--m);font-size:13px;color:var(--ok)}
.acc-h .chv{color:var(--dim);transition:.2s;margin-left:auto}

.acc-b{display:none;background:var(--surf);border:1px solid var(--bd);border-top:none;border-radius:0 0 var(--r) var(--r)}

.crow{display:flex;align-items:flex-start;gap:16px;padding:14px 20px;border-bottom:1px solid var(--bd)}
.crow:last-child{border-bottom:none}
.crow .flag{font-size:22px}
.crow .info{flex:1}
.crow .nm{font-weight:600;font-size:14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:3px}
.crow .per{font-family:var(--m);font-size:11px;color:var(--mut);margin-bottom:4px}
.crow .desc{font-size:13px;color:var(--mut)}
.crow .days{font-family:var(--m);font-size:13px;color:var(--ok);font-weight:700;text-align:right;min-width:50px}
.crow .days small{display:block;font-size:10px;color:var(--dim);font-weight:400}
.sub-acc-h{display:flex;align-items:center;gap:10px;padding:10px 20px;cursor:pointer;border-bottom:1px solid var(--bd)}
.sub-acc-h:hover{background:var(--surf2)}

.sub-acc-h .tot{font-family:var(--m);font-size:12px;color:var(--mut)}

.sub-acc-b{display:none;padding:0 20px 12px 36px}
.sub-acc-b.on{display:block}
.crow2{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--bd);font-size:12px}
.crow2:last-child{border-bottom:none}
.crow2 .nm{flex:1;color:var(--mut)}
.crow2 .d{color:var(--dim);font-family:var(--m);font-size:11px}
.crow2 .v{font-family:var(--m);color:var(--ok);font-size:12px}
.sect{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--dim);margin:4px 0 14px;font-family:var(--m)}
.info{background:var(--surf);border:1px solid var(--bd);border-radius:var(--r);padding:16px 20px;font-size:13px;color:var(--mut);margin-bottom:12px}
.info b{color:var(--warn)}
.vcard{background:var(--surf);border:1px solid var(--bd);border-radius:var(--r);padding:16px 20px;margin-bottom:10px;display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:16px}
.vcard .pais{font-weight:600;font-size:14px;grid-column:1/-1;border-bottom:1px solid var(--bd);padding-bottom:10px;margin-bottom:4px}
.vcard .fld label{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);display:block;margin-bottom:3px}
.vcard .fld span{font-size:13px;color:var(--mut)}
.vcard .vlr{text-align:right}
.vcard .vlr .num{font-family:var(--m);font-size:18px;font-weight:700;color:var(--ok)}
.valert{background:var(--warnd);border:1px solid rgba(255,184,77,.2);border-radius:var(--rs);padding:8px 12px;font-size:12px;color:var(--warn);grid-column:1/-1}
.vacrow{background:var(--surf);border:1px solid var(--bd);border-radius:var(--r);padding:14px 18px;margin-bottom:8px;display:grid;grid-template-columns:auto 1fr auto auto;gap:14px;align-items:center}
.vacrow input{width:16px;height:16px;accent-color:var(--ok);cursor:pointer}
.vacrow .nm{font-weight:600;font-size:13px}
.vacrow .dst{font-size:11px;color:var(--mut);margin-top:2px}
.vacrow .prz{font-family:var(--m);font-size:11px;text-align:center}
.vacrow .prz .lb{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
.vacrow .dt{font-size:12px;color:var(--mut);text-align:right}
.vacrow.ok{background:rgba(0,212,170,.08);border-color:rgba(0,212,170,.2)}
.vacrow.ok .nm{color:var(--ok)}
@media(max-width:640px){
  .vacrow{grid-template-columns:auto 1fr;grid-template-areas:"cb nome" "prz prz" "dt dt";row-gap:10px}
  .vacrow>input[type=checkbox]{grid-area:cb}
  .vacrow>div:nth-child(2){grid-area:nome}
  .vacrow .prz{grid-area:prz;text-align:left}
  .vacrow>div:last-child{grid-area:dt;align-items:flex-start !important}
  .vacrow .dt{text-align:left;max-width:none !important}
}
.prep-h{display:flex;align-items:center;gap:10px;padding:13px 18px;cursor:pointer}
.prep-h .nm{font-weight:600;font-size:13px;flex:1}
.prep-h .prog{font-family:var(--m);font-size:11px;color:var(--mut)}
.ptask{display:flex;align-items:center;gap:12px;padding:9px 20px;border-bottom:1px solid var(--bd)}
.ptask:hover{background:var(--surf2)}
.ptask input{width:15px;height:15px;accent-color:var(--ok);cursor:pointer}
.ptask .txt{font-size:13px;color:var(--mut)}
.ptask.done .txt{text-decoration:line-through;color:var(--dim)}
.add{background:var(--surf2);border:1px dashed var(--bd);color:var(--mut);padding:8px 14px;border-radius:var(--rs);cursor:pointer;font-family:var(--f);font-size:13px;width:100%}
.add:hover{border-color:var(--ok);color:var(--ok)}
.rmv{background:none;border:none;color:var(--dim);cursor:pointer;font-size:14px;padding:2px 6px;border-radius:var(--rs)}
.rmv:hover{color:var(--bad);background:var(--badd)}
.ordbtn{background:var(--surf2);border:1px solid var(--bd);color:var(--mut);cursor:pointer;font-size:11px;padding:2px 6px;border-radius:var(--rs)}
.ordbtn:hover:not(:disabled){border-color:var(--ok);color:var(--ok)}
.ordbtn:disabled{opacity:.3;cursor:not-allowed}
.sec-toggle{user-select:none}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--bd);border-radius:3px}

/* ===== Roteiro Detalhado (editor) — escopado sob .detwrap ===== */
.detwrap .info{margin-bottom:20px}
.detwrap .info b{color:var(--ok)}
.detwrap .pcard{background:var(--surf);border:1px solid var(--bd);border-radius:var(--r);margin-bottom:10px;overflow:hidden}
.detwrap .pcard.new{border-color:rgba(0,212,170,.4);background:rgba(0,212,170,.04)}
.detwrap .ph{display:flex;align-items:center;gap:12px;padding:14px 18px;cursor:pointer}

.detwrap .ph .flag{font-size:22px}
.detwrap .ph input.nm{background:none;border:none;color:var(--tx);font-family:var(--f);font-size:14px;font-weight:600;width:160px;padding:4px 6px;border-radius:var(--rs)}

.detwrap .pb{display:none;padding:0 18px 16px}

.detwrap .cb{display:none;padding:0 14px 12px}

.detwrap .poi{display:grid;grid-template-columns:1fr 110px 90px auto;gap:8px;align-items:center;padding:8px 10px;background:var(--surf3);border-radius:var(--rs);margin-bottom:6px}

.detwrap .add{background:none;border:1px dashed var(--bd);color:var(--mut);font-family:var(--f);font-size:12px;padding:8px 14px;border-radius:var(--rs);cursor:pointer;width:100%;text-align:left}

.detwrap .benv:disabled{background:var(--bd);color:var(--dim);cursor:not-allowed}
.detwrap .pend{font-family:var(--m);font-size:11px;background:var(--warnd);color:var(--warn);padding:4px 10px;border-radius:99px;white-space:nowrap}
.detwrap .ovl{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:300;align-items:center;justify-content:center;padding:24px}

// Hemisfério de cada país. hemisferio:null = zona tropical/equatorial, onde a divisão
// primavera/verão não se aplica (clima seco/chuvoso) — sem checagem.
// Datas de início/fim de primavera+verão usam as datas aproximadas de equinócio/solstício
// (variam 1 dia entre anos, mas essa aproximação é suficiente aqui):
//   Hemisfério Norte: primavera+verão = 20/mar até 22/set
//   Hemisfério Sul:   primavera+verão = 23/set até 20/mar (vira o ano)
const NORTE={hemisferio:'N'};
const SUL={hemisferio:'S'};
const TROPICAL={hemisferio:null};
const ESTACOES={
  MA:NORTE,PT:NORTE,ES:NORTE,FR1:NORTE,MC:NORTE,IT1:NORTE,AT1:NORTE,SK:NORTE,AT2:NORTE,DE1:NORTE,DK:NORTE,SE:NORTE,NO:NORTE,IS:NORTE,
  IE:NORTE,GB:NORTE,NL:NORTE,BE:NORTE,LU:NORTE,FR2:NORTE,CH:NORTE,FR3:NORTE,IT2:NORTE,AL:NORTE,GR:NORTE,TR:NORTE,EG:NORTE,AE:NORTE,
  NP:NORTE,CN:NORTE,JP:NORTE,KR:NORTE,
  VN:TROPICAL,PH:TROPICAL,SG:TROPICAL,ID:TROPICAL,TZ:TROPICAL,TH:TROPICAL,
  ZA:SUL,AU:SUL,NZ:SUL
};
function estacaoPermitida(hemi, d){
  const m=d.getMonth()+1, dia=d.getDate();
  if(hemi==='N'){
    if(m>3 && m<9) return true;             // abr–ago inteiros
    if(m===3 && dia>=20) return true;        // a partir do equinócio de março
    if(m===9 && dia<=22) return true;        // até o equinócio de setembro
    return false;
  }
  // hemisfério Sul: primavera+verão de 23/set a 20/mar (vira o ano)
  if(m>9 || m<3) return true;                // out–fev inteiros
  if(m===9 && dia>=23) return true;          // a partir do equinócio de setembro
  if(m===3 && dia<=20) return true;          // até o equinócio de março
  return false;
}
function checarEstacao(id,p){
  const est=ESTACOES[id];
  if(!est || !est.hemisferio) return null; // sem regra para zona tropical/desconhecida
  let d=new Date(p.ini+'T00:00:00');
  const fimD=new Date(p.fim+'T00:00:00');
  let diasFora=0, primeiraFora=null, ultimaFora=null;
  while(d<=fimD){
    if(!estacaoPermitida(est.hemisferio, d)){
      diasFora++;
      if(!primeiraFora) primeiraFora=new Date(d);
      ultimaFora=new Date(d);
    }
    d.setDate(d.getDate()+1);
  }
  if(!diasFora) return null;
  const fmt=dt=>dt.toISOString().slice(0,10).split('-').reverse().join('/');
  return {hemisferio:est.hemisferio, diasFora, deAte: primeiraFora.getTime()===ultimaFora.getTime() ? fmt(primeiraFora) : `${fmt(primeiraFora)} a ${fmt(ultimaFora)}`};
}

// Meses de estação seca para os países tropicais/equatoriais (o restante é considerado chuvoso).
// Aproximação geral por país — clima local pode variar por região dentro do país.
const MESES_SECOS={
  VN:[11,12,1,2,3,4],   // Vietnã: seca nov–abr, chuvosa/tufões mai–out
  PH:[11,12,1,2,3,4],   // Filipinas: seca nov–abr, chuvosa/tufões mai–out
  SG:[2,3,4,5,6,7,8,9], // Singapura: menos chuva fev–set, monção chuvosa out–jan
  ID:[4,5,6,7,8,9,10],  // Indonésia (Bali): seca abr–out, chuvosa nov–mar
  TZ:[1,2,6,7,8,9,10],  // Tanzânia: seca jun–out + jan–fev, chuvas mar–mai e nov–dez
  TH:[11,12,1,2,3,4],   // Tailândia: seca/fresco nov–abr, chuvosa/monção mai–out
};
function climaTropical(id,p){
  const secos=MESES_SECOS[id];
  if(!secos) return null;
  let diasSeca=0, diasChuva=0;
  let d=new Date(p.ini+'T00:00:00');
  const fimD=new Date(p.fim+'T00:00:00');
  while(d<=fimD){
    const m=d.getMonth()+1;
    if(secos.includes(m)) diasSeca++; else diasChuva++;
    d.setDate(d.getDate()+1);
  }
  if(diasChuva===0) return {status:'seca', label:'☀️ Estação seca', cls:'p-ok'};
  if(diasSeca===0) return {status:'chuvosa', label:'🌧️ Estação chuvosa', cls:'p-warn'};
  return {status:'mista', label:`🌦️ Mista (${diasSeca}d seca / ${diasChuva}d chuvosa)`, cls:'p-ac2'};
}

const diasEntre=(a,b)=>Math.round((new Date(b)-new Date(a))/86400000);
// ===== Horário de Trabalho local (08:00–18:00 horário de Brasília, sem horário de verão) =====
const BRASILIA_OFFSET=-3;
function tzOffsetPadrao(paisId, cidadeNome){
  const chave=paisId+':'+cidadeNome;
  if(TZ_CIDADE_OVERRIDE[chave]!=null) return TZ_CIDADE_OVERRIDE[chave];
  if(TZ_PAIS_DEFAULT[paisId]!=null) return TZ_PAIS_DEFAULT[paisId];
  return null;
}
function calcHorarioLocal(offsetHoras){
  if(offsetHoras==null || isNaN(offsetHoras)) return null;
  const diffMin=Math.round((offsetHoras-BRASILIA_OFFSET)*60);
  const norm=m=>((m%1440)+1440)%1440;
  const fmt=m=>{const h=Math.floor(m/60).toString().padStart(2,'0');const mi=(m%60).toString().padStart(2,'0');return `${h}:${mi}`};
  return `${fmt(norm(8*60+diffMin))} às ${fmt(norm(18*60+diffMin))}`;
}
// Preenche o fuso (tzOffset) de toda cidade que ainda não tenha, usando a tabela padrão.
// Retorna o que foi preenchido automaticamente e o que ficou sem dado (precisa definição manual).
function preencherFusosFaltantes(){
  const preenchidos=[], semDados=[];
  PAISES_INDEX.forEach(id=>{
    const p=PAISES_DB[id];
    (p.cid||[]).forEach(c=>{
      if(c.tzOffset==null || c.tzOffset===''){
        const def=tzOffsetPadrao(id, c.nome);
        if(def!=null){ c.tzOffset=def; preenchidos.push(`${p.nome} — ${c.nome}`); }
        else{ semDados.push(`${p.nome} — ${c.nome}`); }
      }
    });
  });
  return {preenchidos, semDados};
}
function addDias(iso, n){
  const d = new Date(iso+'T00:00:00');
  d.setDate(d.getDate()+n);
  return d.toISOString().slice(0,10);
}
function recalcDias(p){
  // Convenção: fim é o último dia (inclusive) e é o mesmo dia do início do próximo país
  // (dia de troca compartilhado). Por isso dias = diferença + 1.
  const d=diasEntre(p.ini,p.fim)+1;
  if(d>0)p.dias=d;
}
// Empurra/recua ini e fim de todos os países depois de paisId em `diff` dias (cascata).
function propagarAPartirDe(paisId, diff){
  if(diff === 0) return;
  const idx = PAISES_INDEX.indexOf(paisId);
  for(let i=idx+1; i<PAISES_INDEX.length; i++){
    const seg = PAISES_DB[PAISES_INDEX[i]];
    if(!seg) continue;
    seg.ini = addDias(seg.ini, diff);
    seg.fim = addDias(seg.fim, diff);
  }
}
// Duração (em dias) de uma cidade, calculada a partir de ini/fim (mesma convenção do país: fim inclusive).
// Duração (em dias/noites) de uma cidade. Diferente do país, aqui NÃO soma +1: o dia de fim
// é o dia de saída (compartilhado com o início da próxima cidade), então não conta como dia extra
// naquela cidade. Ex: chega dia 11, sai dia 12 → 1 dia/noite ali, não 2.
function duracaoCidade(c){ return diasEntre(c.ini,c.fim); }
// Garante continuidade entre as cidades de um país (cidade[i].ini === cidade[i-1].fim), preservando
// a duração de cada cidade, e recalcula p.ini/p.fim/p.dias a partir da 1ª e última cidade.
// Usada após adicionar/remover cidade (ajuste estrutural, "fecha buracos" automaticamente).
function reconstruirPaisDeCidades(paisId){
  const p=PAISES_DB[paisId];
  if(!p.cid || !p.cid.length) return;
  for(let i=1;i<p.cid.length;i++){
    const diff=diasEntre(p.cid[i].ini, p.cid[i-1].fim);
    if(diff!==0){
      p.cid[i].ini=addDias(p.cid[i].ini,diff);
      p.cid[i].fim=addDias(p.cid[i].fim,diff);
    }
  }
  p.ini=p.cid[0].ini;
  p.fim=p.cid[p.cid.length-1].fim;
  recalcDias(p);
}
// Migração: preenche ini/fim de cidades antigas que só tinham "dias" (dado legado),
// encadeando a partir do início do país. Roda uma vez ao carregar os dados.
function migrarDatasCidades(){
  PAISES_INDEX.forEach(id=>{
    const p=PAISES_DB[id];
    if(!p || !Array.isArray(p.cid)) return;
    let cursor=p.ini;
    p.cid.forEach(c=>{
      if(!c.ini || !c.fim){
        const dias = c.dias || 1;
        c.ini = cursor;
        c.fim = addDias(cursor, dias-1);
      }
      delete c.dias;
      cursor = c.fim;
    });
  });
}

function cmpBarHtml(realizado, planejado){
  const pct = planejado>0 ? (realizado/planejado*100) : (realizado>0?100:0);

  return `<div class="cmp"><span class="cmp-txt">Realizado</span><div class="cmp-bar"><div class="cmp-fill ${cls}" style="width:${Math.min(pct,100)}%"></div></div><span class="cmp-txt"><b style="color:var(--tx)">${fmtR(realizado)}</b> / ${fmtR(planejado)} (${pct.toFixed(0)}%)</span></div>`;
}

function calcValidadeVacina(v){
  // Retorna {status:'sem-data'|'sem-validade'|'valida'|'expira-antes', dataExpira}
  if(!v.tomada || !v.dataAplicacao) return {status:'sem-data'};
  if(v.vitalicia) return {status:'valida'};
  if(v.validadeAnos==null) return {status:'sem-validade'};
  const dExp = new Date(v.dataAplicacao+'T00:00:00');
  dExp.setFullYear(dExp.getFullYear()+v.validadeAnos);
  const fimViagem = new Date((META.fim||'2028-03-31')+'T00:00:00');
  const dataExpira = dExp.toISOString().slice(0,10);
  return {status: dExp>=fimViagem ? 'valida':'expira-antes', dataExpira};
}

function calcPrazoVacina(v){
  // Calcula até quando a vacina precisa ser tomada, contando o lead time (leadDays)
  // a partir da data mais cedo entre os destinos que a exigem (ou início da viagem, se "todos os destinos").
  if(v.tomada) return null;
  let dataAlvo=null;
  if(!v.destinosIds){
    dataAlvo=new Date(META.inicio+'T00:00:00');
  }else{
    v.destinosIds.forEach(id=>{
      const p=PAISES_DB[id];
      if(p){ const d=new Date(p.ini+'T00:00:00'); if(!dataAlvo||d<dataAlvo) dataAlvo=d; }
    });
    if(!dataAlvo) dataAlvo=new Date(META.inicio+'T00:00:00');
  }
  const prazoLimite=new Date(dataAlvo);
  prazoLimite.setDate(prazoLimite.getDate()-(v.leadDays||14));
  const hoje=new Date(); hoje.setHours(0,0,0,0);
  const diasRestantes=Math.round((prazoLimite-hoje)/86400000);
  return {prazoLimite:prazoLimite.toISOString().slice(0,10), diasRestantes};
}

    async function salvar(){
      try{ await setDoc(doc(dbFs,'vacinas',String(i)), v); }
      catch(e){ console.error('Erro ao salvar vacina:',e); dt.innerHTML='<span style="color:var(--bad)">⚠ erro ao salvar</span>'; }
    }
    function atualizarLinha(){
      const rr=calcValidadeVacina(v);
      row.classList.toggle('ok', rr.status==='valida');
      dt.innerHTML=statusHtml(v,rr);
    }
    cb.onchange=async()=>{
      v.tomada=cb.checked;
      if(!cb.checked){ v.dataAplicacao=''; dtInput.value=''; }
      atualizarLinha();
      await salvar();
    };
    dtInput.onchange=async()=>{
      v.dataAplicacao=dtInput.value;
      if(dtInput.value && !cb.checked){ cb.checked=true; v.tomada=true; }
      atualizarLinha();
      await salvar();
    };
    cont.appendChild(row);
  });
  return wrap;
}

async function salvarPrepSecao(i){
  try{ await setDoc(doc(dbFs,'prep',String(i)), PREP[i]); }
  catch(e){ console.error('Erro ao salvar seção de preparativos:',e); }
}
async function salvarPrepIndex(){
  try{ await setDoc(doc(dbFs,'config','prep_index'), {total: PREP.length}); }
  catch(e){ console.error('Erro ao salvar índice de preparativos:',e); }
}
async function removerPrepSecaoFirestore(i){
  try{ await deleteDoc(doc(dbFs,'prep',String(i))); }
  catch(e){ console.error('Erro ao remover seção:',e); }
}
async function resincronizarTodasSecoes(){
  // Após reordenar/remover, os índices mudam — regrava todas as seções nas novas posições
  // e apaga documentos órfãos (índices antigos além do novo total)
  try{
    const idxSnap = await getDoc(doc(dbFs,'config','prep_index'));
    const totalAntigo = idxSnap.exists() ? (idxSnap.data().total||0) : PREP.length;
    for(let i=0;i<PREP.length;i++) await setDoc(doc(dbFs,'prep',String(i)), PREP[i]);
    for(let i=PREP.length;i<totalAntigo;i++) await deleteDoc(doc(dbFs,'prep',String(i)));
    await salvarPrepIndex();
  }catch(e){ console.error('Erro ao resincronizar seções:',e); }
}

function pagePrep(){
  const wrap=el(`<div><div class="sect">Preparativos — crie seções e tarefas, marque ao concluir</div><div id="pl"></div><button class="add" id="addsec" style="margin-top:10px">+ Nova seção</button></div>`);
  const cont=wrap.querySelector('#pl');

  function renderSecoes(){
    cont.innerHTML='';
    PREP.forEach((sec,i)=>{
      const done = sec.tasks.filter(t=>t.d).length;
      const acc=el(`<div class="acc">
        <div class="acc-h prep-h">
          <button class="ordbtn" data-up="${i}" title="Mover para cima" ${i===0?'disabled':''}>↑</button>
          <button class="ordbtn" data-down="${i}" title="Mover para baixo" ${i===PREP.length-1?'disabled':''}>↓</button>
          <span class="nm sec-toggle" data-toggle="${i}" style="cursor:pointer">${sec.sec}</span>
          <span class="prog">${done}/${sec.tasks.length}</span>
          <button class="rmv" data-rmsec="${i}" title="Remover seção">✕</button>
          <span class="chv sec-toggle" data-toggle="${i}" style="cursor:pointer">▾</span>
        </div>
        <div class="acc-b" id="prep-b-${i}"></div>
      </div>`);
      const body=acc.querySelector('.acc-b');
      sec.tasks.forEach((t,ti)=>{
        const task=el(`<div class="ptask ${t.d?'done':''}"><input type="checkbox" ${t.d?'checked':''}><label class="txt">${t.t}</label><button class="rmv" data-rmtask="${i}:${ti}" title="Remover tarefa">✕</button></div>`);
        const cb=task.querySelector('input');
        cb.onchange=async()=>{
          t.d=cb.checked;
          task.classList.toggle('done',cb.checked);
          const doneCount=sec.tasks.filter(x=>x.d).length;
          acc.querySelector('.prog').textContent=`${doneCount}/${sec.tasks.length}`;
          await salvarPrepSecao(i);
        };
        body.appendChild(task);
      });
      const addTaskRow=el(`<div class="ptask" style="gap:8px">
        <input type="text" placeholder="Nova tarefa..." class="addtask-input" style="flex:1;background:var(--surf2);border:1px solid var(--bd);color:var(--tx);padding:6px 10px;border-radius:var(--rs);font-family:var(--f);font-size:13px">
        <button class="add" data-addtask="${i}" style="width:auto;padding:6px 14px">+ Adicionar</button>
      </div>`);
      body.appendChild(addTaskRow);
      cont.appendChild(acc);
    });
  }
  renderSecoes();

  cont.addEventListener('click', async e=>{
    const upI = e.target.dataset.up;
    const downI = e.target.dataset.down;
    const toggleI = e.target.dataset.toggle;
    const rmSecI = e.target.dataset.rmsec;
    const rmTask = e.target.dataset.rmtask;
    const addTaskI = e.target.dataset.addtask;

    if(toggleI!==undefined){
      const accEl = cont.children[+toggleI];
      accEl.querySelector('.acc-h').classList.toggle('on');
      accEl.querySelector('.acc-b').classList.toggle('on');
      return;
    }
    if(upI!==undefined){
      const i=+upI;
      if(i>0){ [PREP[i-1],PREP[i]]=[PREP[i],PREP[i-1]]; renderSecoes(); await resincronizarTodasSecoes(); }
      return;
    }
    if(downI!==undefined){
      const i=+downI;
      if(i<PREP.length-1){ [PREP[i+1],PREP[i]]=[PREP[i],PREP[i+1]]; renderSecoes(); await resincronizarTodasSecoes(); }
      return;
    }
    if(rmSecI!==undefined){
      if(!confirm(`Remover a seção "${PREP[+rmSecI].sec}" e todas as suas tarefas?`)) return;
      PREP.splice(+rmSecI,1);
      renderSecoes();
      await resincronizarTodasSecoes();
      return;
    }
    if(rmTask){
      const [si,ti]=rmTask.split(':').map(Number);
      PREP[si].tasks.splice(ti,1);
      renderSecoes();
      await salvarPrepSecao(si);
      return;
    }
    if(addTaskI!==undefined){
      const i=+addTaskI;
      const input = e.target.closest('.ptask').querySelector('.addtask-input');
      const texto = input.value.trim();
      if(!texto) return;
      PREP[i].tasks.push({t:texto,d:false});
      renderSecoes();
      await salvarPrepSecao(i);
    }
  });

  wrap.querySelector('#addsec').onclick=async()=>{
    const nome = prompt('Nome da nova seção:');
    if(!nome || !nome.trim()) return;
    PREP.push({sec:nome.trim(), tasks:[]});
    renderSecoes();
    await resincronizarTodasSecoes();
  };

  return wrap;
}

/* ===== Aba Roteiro Detalhado (editor) ===== */
let pendingDet=false, novosIdsDet=new Set(), counterDet=0;

function pageRoteiroDetalhado(){
  const wrap=el(`<div class="detwrap">

  const $$=s=>wrap.querySelector(s);

  function capturarEstadoAberto(){

  function renderDet(estadoAberto){

    const cont=$$('#det-paises'); cont.innerHTML='';
    $$('#det-cnt').textContent=`(${PAISES_INDEX.length})`;
    PAISES_INDEX.forEach(id=>{
      const p=PAISES_DB[id];
      if(!p || !Array.isArray(p.cid)){
        console.warn('País sem dados válidos, pulado no render:', id, p);
        return;
      }
      const mismatch = p.cid.length && (p.cid[0].ini!==p.ini || p.cid[p.cid.length-1].fim!==p.fim);
      const climaDet=climaTropical(id,p);
      const climaDetTag=climaDet?`<span class="sg" style="background:${climaDet.status==='chuvosa'?'var(--warnd)':climaDet.status==='mista'?'var(--ac2d)':'var(--okd)'};color:${climaDet.status==='chuvosa'?'var(--warn)':climaDet.status==='mista'?'var(--ac2)':'var(--ok)'}">${climaDet.label}</span>`:'';
      const card=el(`<div class="pcard ${novosIdsDet.has(id)?'new':''}" id="det-pc-${id}">
        <div class="ph" data-id="${id}">
          <div class="flag">${FLAGS[id]||'🏳️'}</div>
          <input class="nm" value="${p.nome}">
          <span class="per">${fmtD(p.ini)} → ${fmtD(p.fim)}</span>
          <span class="db">${p.dias}d</span>
          <span class="sg ${p.sch?'sy':'sn'}">${p.sch?'Schengen':'Fora Schengen'}</span>
          ${climaDetTag}
          ${mismatch?`<span class="sg" style="background:var(--warnd);color:var(--warn)">⚠ datas das cidades não fecham com o país</span>`:''}
          <button class="rmv" data-rm="${id}">✕</button>
          <div class="chv">▾</div>
        </div>
        <div class="pb" id="det-pb-${id}">
          <div class="mrow">
            <div class="mfld"><label>Data início</label><input type="date" class="f-ini" value="${p.ini}"></div>
            <div class="mfld"><label>Data fim</label><input type="date" class="f-fim" value="${p.fim}"></div>
            <div class="mfld"><label>Custo/dia (R$)</label><input type="number" class="f-dpd" value="${p.dpd}"></div>
            <div class="mfld"><label>Schengen?</label><select class="f-sch"><option value="1" ${p.sch?'selected':''}>Sim</option><option value="0" ${!p.sch?'selected':''}>Não</option></select></div>
          </div>
          <div class="cwrap" id="det-cw-${id}"></div>
          <button class="add addcid" data-pais="${id}">+ Adicionar cidade em ${p.nome}</button>

      if(abertos.paises.has(id)){
        card.querySelector('.ph').classList.add('on');
        card.querySelector('.pb').classList.add('on');
      }
      renderCidadesDet(id, abertos);
    });
  }

  function datasCidadeHtml(paisId, ci, c){
    const dias=duracaoCidade(c);
    return `<div class="mrow" style="border-bottom:1px solid var(--bd);padding-bottom:10px;margin-bottom:10px">
      <div class="mfld"><label>Data início</label><input type="date" class="f-cini" data-cini="${paisId}:${ci}" value="${c.ini}"></div>
      <div class="mfld"><label>Data fim</label><input type="date" class="f-cfim" data-cfim="${paisId}:${ci}" value="${c.fim}"></div>
      <div class="mfld"><label>Dias</label><span style="font-family:var(--m);font-size:13px;color:var(--ok);padding:6px 0;display:inline-block">${dias}d</span></div>
    </div>`;
  }

  function horarioHtml(paisId, ci, c){
    const padrao=tzOffsetPadrao(paisId, c.nome);
    const efetivo=(c.tzOffset!=null && c.tzOffset!=='') ? parseFloat(c.tzOffset) : padrao;
    const horario=calcHorarioLocal(efetivo);
    return `<div class="mrow" style="border-bottom:1px solid var(--bd);padding-bottom:10px;margin-bottom:10px">
      <div class="mfld"><label>Fuso (UTC)</label><input type="number" step="0.25" class="f-tz" data-tz="${paisId}:${ci}" value="${c.tzOffset!=null && c.tzOffset!=='' ? c.tzOffset : ''}" placeholder="${padrao!=null?padrao:'?'}" style="width:70px"></div>
      <div class="mfld" style="flex:1;min-width:240px"><label>Horário de Trabalho — 08:00 às 18:00 (Brasília)</label><span id="det-hor-${paisId}-${ci}" style="font-family:var(--m);font-size:13px;${horario?'color:var(--ok)':'color:var(--warn)'}">${horario?horario+' (horário local)':'⚠ fuso não definido — clique em "Enviar atualização" para preencher'}</span></div>
    </div>`;
  }

  function renderCidadesDet(paisId, abertos){
    abertos = abertos || {cidades:new Set()};
    const p=PAISES_DB[paisId];
    const wrapC=$$('#det-cw-'+paisId); wrapC.innerHTML='';
    p.cid.forEach((c,ci)=>{
      const card=el(`<div class="ccard">
        <div class="ch" data-pais="${paisId}" data-ci="${ci}">
          <span class="icn">📍</span>
          <input class="nm" placeholder="Nome da cidade" value="${c.nome}" data-cnome="${paisId}:${ci}">
          <span class="dl" style="font-family:var(--m);font-size:11px;color:var(--mut);white-space:nowrap">${fmtD(c.ini)} → ${fmtD(c.fim)}</span>
          <span class="db" style="font-family:var(--m);font-size:12px;font-weight:700;color:var(--ok);background:var(--okd);padding:3px 10px;border-radius:99px;white-space:nowrap">${duracaoCidade(c)}d</span>
          <input class="nm" style="width:110px" placeholder="transporte →" value="${c.transp_saida||''}" data-transp="${paisId}:${ci}">
          <button class="rmv" data-rmcid="${paisId}:${ci}">✕</button>
          <span class="chv">▾</span>
        </div>
        <div class="cb" id="det-cb-${paisId}-${ci}">
          ${datasCidadeHtml(paisId,ci,c)}
          ${horarioHtml(paisId,ci,c)}
          <div id="det-poi-${paisId}-${ci}"></div>
          <button class="add addpoi" data-pais="${paisId}" data-ci="${ci}">+ Adicionar ponto de interesse</button>
        </div>
      </div>`);
      wrapC.appendChild(card);
      if(abertos.cidades.has(paisId+':'+ci)){
        card.querySelector('.ch').classList.add('on');
        card.querySelector('.cb').classList.add('on');
      }
      renderPoisDet(paisId, ci);
    });
  }

  function renderPoisDet(paisId, ci){
    const c=PAISES_DB[paisId].cid[ci];
    const wrapP=$$(`#det-poi-${paisId}-${ci}`); if(!wrapP)return; wrapP.innerHTML='';
    (c.poi||[]).forEach((poi,pi)=>{
      const row=el(`<div class="poi">
        <input type="text" placeholder="Nome do ponto de interesse" value="${poi.nome||''}" data-poi="${paisId}:${ci}:${pi}:nome">
        <input type="date" value="${poi.data||''}" data-poi="${paisId}:${ci}:${pi}:data">
        <input type="number" class="vlr" placeholder="R$" value="${poi.valor!=null?poi.valor:''}" data-poi="${paisId}:${ci}:${pi}:valor">
        <button class="rmv" data-rmpoi="${paisId}:${ci}:${pi}">✕</button>
      </div>`);
      wrapP.appendChild(row);
    });
  }

  function marcarPendenteDet(){
    pendingDet=true;
    $$('#det-pbadge').style.display='inline-block';
    $$('#det-pinfo').textContent='Você tem alterações não enviadas';
    $$('#det-benv').disabled=false;
  }

  /* ===== Delegação de eventos, escopada ao wrap deste editor ===== */
  wrap.addEventListener('click', e=>{
    const ph=e.target.closest('.ph');
    if(ph && !e.target.matches('input,button')){ph.classList.toggle('on');$$('#det-pb-'+ph.dataset.id).classList.toggle('on');return}
    const ch=e.target.closest('.ch');
    if(ch && !e.target.matches('input,button')){ch.classList.toggle('on');$$(`#det-cb-${ch.dataset.pais}-${ch.dataset.ci}`).classList.toggle('on');return}
    if(e.target.dataset.rm){
      if(!confirm(`Remover ${PAISES_DB[e.target.dataset.rm].nome} do roteiro?`))return;
      const id=e.target.dataset.rm;
      PAISES_INDEX=PAISES_INDEX.filter(x=>x!==id);
      delete PAISES_DB[id]; novosIdsDet.delete(id);
      marcarPendenteDet(); renderDet(capturarEstadoAberto());
    }
    if(e.target.dataset.rmcid){
      const[pid,ci]=e.target.dataset.rmcid.split(':');
      const p=PAISES_DB[pid];
      const oldPaisFim=p.fim;
      p.cid.splice(+ci,1);
      reconstruirPaisDeCidades(pid);
      propagarAPartirDe(pid, diasEntre(oldPaisFim, p.fim));
      marcarPendenteDet(); renderDet(capturarEstadoAberto());
    }
    if(e.target.dataset.rmpoi){
      const[pid,ci,pi]=e.target.dataset.rmpoi.split(':');
      PAISES_DB[pid].cid[+ci].poi.splice(+pi,1);
      marcarPendenteDet(); renderPoisDet(pid,+ci);
    }
    if(e.target.classList.contains('addcid')){
      const pid=e.target.dataset.pais;
      const p=PAISES_DB[pid];
      const base = p.cid.length ? p.cid[p.cid.length-1].fim : p.ini;
      p.cid.push({nome:'', ini:base, fim:base, poi:[]});
      marcarPendenteDet(); renderDet(capturarEstadoAberto());
    }
    if(e.target.classList.contains('addpoi')){
      const pid=e.target.dataset.pais, ci=+e.target.dataset.ci;
      if(!PAISES_DB[pid].cid[ci].poi)PAISES_DB[pid].cid[ci].poi=[];
      PAISES_DB[pid].cid[ci].poi.push({nome:'',data:'',valor:0});
      marcarPendenteDet(); renderPoisDet(pid,ci);
    }
  });

  wrap.addEventListener('change', e=>{
    const ph=e.target.closest('.ph');
    if(ph && e.target.classList.contains('nm')){PAISES_DB[ph.dataset.id].nome=e.target.value; marcarPendenteDet(); return}
    const pb=e.target.closest('.pb');
    if(pb){
      const id=pb.id.replace('det-pb-','');
      const p=PAISES_DB[id];
      if(e.target.classList.contains('f-ini')){
        const iniAntigo=p.ini;
        const diff=diasEntre(iniAntigo, e.target.value);
        p.ini=e.target.value;
        p.fim=addDias(p.fim, diff);
        (p.cid||[]).forEach(c=>{c.ini=addDias(c.ini,diff); c.fim=addDias(c.fim,diff);});
        propagarAPartirDe(id, diff);
        marcarPendenteDet(); renderDet(capturarEstadoAberto()); return;
      }
      if(e.target.classList.contains('f-fim')){
        const fimAntigo=p.fim;
        p.fim=e.target.value;
        const diffP=diasEntre(fimAntigo, p.fim);
        if(p.cid && p.cid.length){ const last=p.cid[p.cid.length-1]; last.fim=addDias(last.fim, diffP); }
        recalcDias(p);
        propagarAPartirDe(id, diffP);
        marcarPendenteDet(); renderDet(capturarEstadoAberto()); return;
      }
      if(e.target.classList.contains('f-dpd')){p.dpd=parseFloat(e.target.value)||0; marcarPendenteDet(); return}
      if(e.target.classList.contains('f-sch')){p.sch=parseInt(e.target.value); marcarPendenteDet(); return}
    }
    if(e.target.dataset.cnome){
      const[pid,ciS]=e.target.dataset.cnome.split(':');
      PAISES_DB[pid].cid[+ciS].nome=e.target.value;
      marcarPendenteDet(); return;
    }
    if(e.target.dataset.cini){
      const[pid,ciStr]=e.target.dataset.cini.split(':'); const ci=+ciStr;
      const p=PAISES_DB[pid]; const c=p.cid[ci];
      const oldPaisFim=p.fim;
      const iniAntigo=c.ini;
      const diff=diasEntre(iniAntigo, e.target.value);
      c.ini=e.target.value;
      c.fim=addDias(c.fim, diff);
      for(let i=ci+1;i<p.cid.length;i++){ p.cid[i].ini=addDias(p.cid[i].ini,diff); p.cid[i].fim=addDias(p.cid[i].fim,diff); }
      p.ini=p.cid[0].ini;
      p.fim=p.cid[p.cid.length-1].fim;
      recalcDias(p);
      propagarAPartirDe(pid, diasEntre(oldPaisFim, p.fim));
      marcarPendenteDet(); renderDet(capturarEstadoAberto()); return;
    }
    if(e.target.dataset.cfim){
      const[pid,ciStr]=e.target.dataset.cfim.split(':'); const ci=+ciStr;
      const p=PAISES_DB[pid]; const c=p.cid[ci];
      const oldPaisFim=p.fim;
      const fimAntigo=c.fim;
      c.fim=e.target.value;
      const diff=diasEntre(fimAntigo, c.fim);
      for(let i=ci+1;i<p.cid.length;i++){ p.cid[i].ini=addDias(p.cid[i].ini,diff); p.cid[i].fim=addDias(p.cid[i].fim,diff); }
      p.fim=p.cid[p.cid.length-1].fim;
      recalcDias(p);
      propagarAPartirDe(pid, diasEntre(oldPaisFim, p.fim));
      marcarPendenteDet(); renderDet(capturarEstadoAberto()); return;
    }
    if(e.target.dataset.transp){
      const[pid,ci]=e.target.dataset.transp.split(':');
      PAISES_DB[pid].cid[+ci].transp_saida=e.target.value;
      marcarPendenteDet();
      return;
    }
    if(e.target.dataset.tz){
      const[pid,ci]=e.target.dataset.tz.split(':');
      const raw=e.target.value;
      const c=PAISES_DB[pid].cid[+ci];
      c.tzOffset = raw===''? null : parseFloat(raw);
      const efetivo = c.tzOffset!=null ? c.tzOffset : tzOffsetPadrao(pid, c.nome);
      const horario = calcHorarioLocal(efetivo);
      const lbl=$$(`#det-hor-${pid}-${ci}`);
      if(lbl){
        lbl.textContent = horario ? horario+' (horário local)' : '⚠ fuso não definido — clique em "Enviar atualização" para preencher';
        lbl.style.color = horario ? 'var(--ok)' : 'var(--warn)';
      }
      marcarPendenteDet();
      return;
    }
    if(e.target.dataset.poi){
      const[pid,ci,pi,campo]=e.target.dataset.poi.split(':');
      const val=campo==='valor'?(parseFloat(e.target.value)||0):e.target.value;
      PAISES_DB[pid].cid[+ci].poi[+pi][campo]=val;
      marcarPendenteDet();
    }
  });

  $$('#det-btnAddPais').onclick=()=>{
    const id='NOVO'+(++counterDet);
    PAISES_DB[id]={nome:'Novo país',ini:META.fim,fim:META.fim,dias:1,sch:0,dpd:150,cid:[]};
    PAISES_INDEX.push(id); novosIdsDet.add(id); FLAGS[id]=FLAGS[id]||'🏳️';
    marcarPendenteDet(); renderDet(capturarEstadoAberto());
    $$('#det-pc-'+id).scrollIntoView({behavior:'smooth',block:'center'});
  };

  /* ===== Revisão / Enviar atualização ===== */
  function gerarRevisaoDet(){
    const findings=[];
    const primeiro=PAISES_INDEX[0], ultimo=PAISES_INDEX[PAISES_INDEX.length-1];
    const ini=PAISES_DB[primeiro]?PAISES_DB[primeiro].ini:META.inicio;
    const fim=PAISES_DB[ultimo]?PAISES_DB[ultimo].fim:META.fim;
    const dur=diasEntre(ini,fim), limite=diasEntre(META.inicio,META.fim);

    findings.push(dur>limite
      ? {t:'danger',tag:'⏱ Duração excedida',txt:`Roteiro soma ${dur} dias, ${dur-limite} além do limite de 1 ano (${limite} dias).`}
      : {t:'ok',tag:'⏱ Duração',txt:`${dur} dias, dentro do limite (margem de ${limite-dur} dias).`});

    const sch=PAISES_INDEX.reduce((s,id)=>s+(PAISES_DB[id].sch?PAISES_DB[id].dias:0),0);
    findings.push(sch>META.schengen_max
      ? {t:'danger',tag:'🇪🇺 Limite Schengen excedido',txt:`${sch} dias Schengen, ${sch-META.schengen_max} acima do limite de ${META.schengen_max}. Reduza dias em algum país Schengen.`}
      : {t:'ok',tag:'🇪🇺 Espaço Schengen',txt:`${sch}/${META.schengen_max} dias — dentro do limite (margem de ${META.schengen_max-sch} dias).`});

    if(PAISES_DB['AU'] && PAISES_DB['AU'].dias>15)
      findings.push({t:'danger',tag:'🇦🇺 Regra Austrália violada',txt:`Austrália com ${PAISES_DB['AU'].dias} dias, acima do máximo de 15 (casa da Michele em Gold Coast).`});

    PAISES_INDEX.forEach(id=>{
      const p=PAISES_DB[id];
      if(!p.cid||!p.cid.length)return;
      const problemas=[];
      if(p.cid[0].ini!==p.ini) problemas.push(`início do país (${fmtD(p.ini)}) ≠ início da 1ª cidade (${fmtD(p.cid[0].ini)})`);
      if(p.cid[p.cid.length-1].fim!==p.fim) problemas.push(`fim do país (${fmtD(p.fim)}) ≠ fim da última cidade (${fmtD(p.cid[p.cid.length-1].fim)})`);
      for(let i=1;i<p.cid.length;i++){
        if(p.cid[i].ini!==p.cid[i-1].fim) problemas.push(`intervalo entre ${p.cid[i-1].nome} (fim ${fmtD(p.cid[i-1].fim)}) e ${p.cid[i].nome} (início ${fmtD(p.cid[i].ini)})`);
      }
      if(problemas.length) findings.push({t:'warn',tag:`⚠ ${p.nome} — datas das cidades não conferem`,txt:problemas.join('; ')+'. Ajuste recomendado.'});
    });

    PAISES_INDEX.forEach(id=>{
      const p=PAISES_DB[id];
      const est=checarEstacao(id,p);
      if(est){
        findings.push({t:'warn',tag:`🌦 ${p.nome} — fora de primavera/verão`,txt:`Período ${fmtD(p.ini)} → ${fmtD(p.fim)} tem ${est.diasFora} dia(s) fora da primavera/verão do hemisfério ${est.hemisferio==='N'?'norte':'sul'} (${est.deAte}).`});
      }
    });

    let custo=0;
    PAISES_INDEX.forEach(id=>{custo+=PAISES_DB[id].dias*(PAISES_DB[id].dpd||0)});
    const pct=custo/META.orcamento*100;
    findings.push(pct>100
      ? {t:'danger',tag:'💰 Orçamento excedido',txt:`R$ ${custo.toLocaleString('pt-BR')} (${pct.toFixed(1)}%). Excedente de R$ ${(custo-META.orcamento).toLocaleString('pt-BR')}.`}
      : pct>90
      ? {t:'warn',tag:'💰 Orçamento — atenção',txt:`R$ ${custo.toLocaleString('pt-BR')} (${pct.toFixed(1)}%). Margem de R$ ${(META.orcamento-custo).toLocaleString('pt-BR')}.`}
      : {t:'ok',tag:'💰 Custo estimado',txt:`R$ ${custo.toLocaleString('pt-BR')} de R$ ${META.orcamento.toLocaleString('pt-BR')} (${pct.toFixed(1)}%). Dentro da meta.`});

    if(novosIdsDet.size>0){
      const nomes=[...novosIdsDet].map(id=>PAISES_DB[id]?PAISES_DB[id].nome:id).join(', ');
      findings.push({t:'warn',tag:'🆕 Países novos adicionados',txt:`${nomes}. Verifique manualmente visto, vacina ou seguro diferenciado — não atualizados automaticamente.`});
    }

    PAISES_INDEX.forEach(id=>{
      const p=PAISES_DB[id];
      (p.cid||[]).forEach(c=>(c.poi||[]).forEach(poi=>{
        if(poi.data && (poi.data<p.ini || poi.data>p.fim))
          findings.push({t:'warn',tag:`📍 ${poi.nome||'Ponto de interesse'} fora do período`,txt:`Data ${fmtD(poi.data)} fora do período de ${p.nome} (${fmtD(p.ini)} → ${fmtD(p.fim)}).`});
      }));
    });
    return findings;
  }

  $$('#det-benv').onclick=()=>{
    const {preenchidos, semDados} = preencherFusosFaltantes();
    if(preenchidos.length) renderDet(capturarEstadoAberto());
    const findings=gerarRevisaoDet();
    if(preenchidos.length) findings.unshift({t:'ok',tag:'🕐 Horário de trabalho preenchido',txt:`Fuso horário calculado e horário de trabalho (08:00–18:00 Brasília) preenchido para: ${preenchidos.join(', ')}.`});
    if(semDados.length) findings.unshift({t:'warn',tag:'🕐 Fuso horário não identificado',txt:`Sem fuso cadastrado para: ${semDados.join(', ')}. Defina manualmente o campo "Fuso (UTC)" na cidade.`});
    const c=$$('#det-rcontent'); c.innerHTML='';
    findings.forEach(f=>c.appendChild(el(`<div class="ritem ${f.t}"><span class="tg">${f.tag}</span>${f.txt}</div>`)));
    const grave=findings.some(f=>f.t==='danger');
    $$('#det-bconf').textContent=grave?'Aplicar mesmo assim (não recomendado)':'Aplicar no roteiro';
    $$('#det-bconf').style.background=grave?'var(--bad)':'var(--ok)';
    $$('#det-ovl').classList.add('on');
  };
  $$('#det-bcanc').onclick=()=>$$('#det-ovl').classList.remove('on');
  $$('#det-bconf').onclick=async()=>{
    $$('#det-ovl').classList.remove('on');
    $$('#det-pinfo').textContent='Salvando no Firestore...';
    try{
      await setDoc(doc(dbFs,'config','paises_index'), {ordem: PAISES_INDEX});
      for(const id of PAISES_INDEX) await setDoc(doc(dbFs,'paises',id), PAISES_DB[id]);
      pendingDet=false; novosIdsDet.clear();
      abaAtiva='detalhado';
      renderApp();
      const novoWrap=$('#pg-detalhado');
      if(novoWrap){
        const pinfo=novoWrap.querySelector('#det-pinfo');
        if(pinfo) pinfo.textContent='✓ Roteiro e Custos atualizados com sucesso';
        setTimeout(()=>{ const pi=$('#pg-detalhado #det-pinfo'); if(pi) pi.textContent='Nenhuma alteração pendente'; },5000);
      }
    }catch(e){
      console.error('Falha ao salvar no Firestore:', e);
      $$('#det-pinfo').textContent='⚠️ Erro ao salvar — tente "Enviar atualização" novamente.';
    }
  };

  function gerarXLSX(){
    const wb = XLSX.utils.book_new();

    const roteiroRows=[["Mês","País","Início","Fim","Dias","Schengen","Descrição"]];
    PAISES_INDEX.forEach(id=>{
      const p=PAISES_DB[id];
      roteiroRows.push([mesKey(p.ini), p.nome, fmtD(p.ini), fmtD(p.fim), p.dias, p.sch?"Sim":"Não", DESC[id]||""]);
    });
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(roteiroRows), "Roteiro");

    const detRows=[["País","Cidade","Início","Fim","Dias","Transporte saída","Fuso (UTC)","Horário de Trabalho (local, 08-18h Brasília)","Ponto de interesse","Data","Valor (R$)"]];
    PAISES_INDEX.forEach(id=>{
      const p=PAISES_DB[id];
      (p.cid||[]).forEach(c=>{
        const efetivo = c.tzOffset!=null ? c.tzOffset : tzOffsetPadrao(id, c.nome);
        const horario = calcHorarioLocal(efetivo) || "não definido";
        const dias = duracaoCidade(c);
        if(c.poi && c.poi.length){
          c.poi.forEach(poi=>detRows.push([p.nome, c.nome, fmtD(c.ini), fmtD(c.fim), dias, c.transp_saida||"", efetivo!=null?efetivo:"", horario, poi.nome||"", poi.data?fmtD(poi.data):"", poi.valor||0]));
        }else{
          detRows.push([p.nome, c.nome, fmtD(c.ini), fmtD(c.fim), dias, c.transp_saida||"", efetivo!=null?efetivo:"", horario, "", "", ""]);
        }
      });
    });
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(detRows), "Roteiro Detalhado");

    const custoRows=[["Tipo","País/Item","Detalhe","Valor (R$)"]];
    let totalGeral=0;
    PAISES_INDEX.forEach(id=>{
      const p=PAISES_DB[id]; const tot=p.dias*(p.dpd||0); totalGeral+=tot;
      custoRows.push(["País", p.nome, `${p.dias}d × R$${p.dpd}/dia`, tot]);
    });
    TRENS.forEach(t=>{ totalGeral+=t.brl; custoRows.push(["Trem", `${t.origem} → ${t.destino}`, t.noturno?"noturno":"diurno", t.brl]); });
    CUSTOS_EXTRAS.forEach(c=>{ totalGeral+=(c.valor||0); custoRows.push(["Extra", c.descricao, c.data||"", c.valor||0]); });
    VISTOS.forEach(v=>{ totalGeral+=(v.custo||0); custoRows.push(["Visto", PAISES_DB[v.id]?PAISES_DB[v.id].nome:v.id, v.forma, v.custo]); });
    custoRows.push(["","","TOTAL GERAL", totalGeral]);
    custoRows.push(["","","Orçamento", META.orcamento]);
    custoRows.push(["","","Margem", META.orcamento-totalGeral]);
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(custoRows), "Custos");

    const vistoRows=[["País","Prazo/Validade","Forma","Custo (R$)","Alerta"]];
    VISTOS.forEach(v=>vistoRows.push([v.id?(PAISES_DB[v.id]?PAISES_DB[v.id].nome:v.id):v.nomeCustom, v.prazo, v.forma, v.custo, v.alerta||""]));
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(vistoRows), "Vistos");

    const FIT_TXT={sim:'Encaixa',parcial:'Perto do limite',nao:'Não encaixa',indef:'Depende de outro critério'};
    const nomadeRows=[["País","Visto","Renda exigida","Como tirar","Validade","Custo","Encaixe (R$12k/mês)","Observação"]];
    NOMADE.forEach(v=>nomadeRows.push([v.pais, v.nomeVisto, v.renda, v.forma, v.validade, v.custo, FIT_TXT[v.fit]||"", v.obs]));
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(nomadeRows), "Nomade Digital");

    const vacRows=[["Vacina","Destinos","Prazo/Validade","Tomada?","Data aplicação","Status"]];
    VACINAS.forEach(v=>{
      const r=calcValidadeVacina(v);
      let status;
      if(v.tomada){
        status = r.status==='valida'?'Válida para toda viagem'
          : r.status==='expira-antes'?`Vence em ${fmtD(r.dataExpira)} — reforço necessário`
          : 'Validade não padronizada';
      }else{
        const pr=calcPrazoVacina(v);
        status = pr ? (pr.diasRestantes<0?`Prazo vencido (era até ${fmtD(pr.prazoLimite)})`:`Tomar até ${fmtD(pr.prazoLimite)} (faltam ${pr.diasRestantes}d)`) : 'Não tomada';
      }
      vacRows.push([v.nome, v.destinos, v.prazo, v.tomada?"Sim":"Não", v.dataAplicacao?fmtD(v.dataAplicacao):"", status]);
    });
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(vacRows), "Vacinas");

    const prepRows=[["Seção","Tarefa","Concluída?"]];
    PREP.forEach(sec=>sec.tasks.forEach(t=>prepRows.push([sec.sec, t.t, t.d?"Sim":"Não"])));
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(prepRows), "Preparativos");

    XLSX.writeFile(wb, "roteiro_fechado.xlsx");
  }
  $$('#det-fechar').onclick=()=>{
    if(typeof XLSX==='undefined'){ alert('Biblioteca de planilha ainda carregando — tente novamente em instantes.'); return; }
    gerarXLSX();
  };

  renderDet();
  return wrap;
}

const PAGES=[["roteiro","📍 Roteiro",pageRoteiro],["custos","💰 Custos",pageCustos],["vistos","🛂 Vistos",pageVistos],["vacinas","💉 Vacinas",pageVacinas],["preparativos","✅ Preparativos",pagePrep],["detalhado","✏️ Roteiro Detalhado",pageRoteiroDetalhado]];
let abaAtiva='roteiro';
function renderApp(){
  const tabsEl=$('#tabs'), pagesEl=$('#pages');
  tabsEl.innerHTML=''; pagesEl.innerHTML='';
  PAGES.forEach(([id,label,fn])=>{
    const isOn=id===abaAtiva;
    const tab=el(`<button class="tab ${isOn?'on':''}">${label}</button>`);
    tab.onclick=()=>{abaAtiva=id;document.querySelectorAll('.tab').forEach(t=>t.classList.remove('on'));document.querySelectorAll('.pg').forEach(p=>p.classList.remove('on'));tab.classList.add('on');$('#pg-'+id).classList.add('on')};
    tabsEl.appendChild(tab);
    const pg=el(`<div class="pg ${isOn?'on':''}" id="pg-${id}"></div>`);
    pg.appendChild(fn());
    pagesEl.appendChild(pg);
  });
}

/* ===== FIREBASE / FIRESTORE ===== */
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc, deleteDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDOIJLwVb2Qs_sjWE0XkcusBXr-LyxVh7Y",
  authDomain: "roteiro-viagem-world.firebaseapp.com",
  projectId: "roteiro-viagem-world",
  storageBucket: "roteiro-viagem-world.firebasestorage.app",
  messagingSenderId: "353171475826",
  appId: "1:353171475826:web:ac2250948400f014b521eb"
};
const fbApp = initializeApp(firebaseConfig);
const dbFs = getFirestore(fbApp);

let CUSTOS_EXTRAS = [];
let GASTOS_REALIZADOS = [];

async function carregarDoFirestore(){
  try{
    const snap = await getDocs(collection(dbFs,'paises'));
    if(snap.empty){
      // Primeira vez: semear o Firestore com os dados embutidos neste arquivo
      await semear();
      return;
    }
    // Reconstituir PAISES_DB e respeitar a ordem salva em paises_index
    const novoDb = {};
    snap.forEach(d=>{ novoDb[d.id] = d.data(); });
    const metaSnap = await getDoc(doc(dbFs,'config','meta'));
    const idxSnap = await getDoc(doc(dbFs,'config','paises_index'));
    if(idxSnap.exists()){
      PAISES_INDEX.length = 0;
      idxSnap.data().ordem.forEach(id=>PAISES_INDEX.push(id));
    }
    Object.keys(PAISES_DB).forEach(k=>delete PAISES_DB[k]);
    Object.assign(PAISES_DB, novoDb);
    if(metaSnap.exists()) Object.assign(META, metaSnap.data());

    // Vacinas
    const vacSnap = await getDocs(collection(dbFs,'vacinas'));
    if(!vacSnap.empty){
      const novasVacinas = new Array(VACINAS.length);
      vacSnap.forEach(d=>{ novasVacinas[+d.id] = d.data(); });
      for(let i=0;i<VACINAS.length;i++) if(novasVacinas[i]) VACINAS[i]=novasVacinas[i];
    }

    // Preparativos
    const prepSnap = await getDocs(collection(dbFs,'prep'));
    if(!prepSnap.empty){
      const prepIdxSnap = await getDoc(doc(dbFs,'config','prep_index'));
      const total = prepIdxSnap.exists() ? prepIdxSnap.data().total : prepSnap.size;
      const novoPrep = new Array(total);
      prepSnap.forEach(d=>{ const i=+d.id; if(i<total) novoPrep[i]=d.data(); });
      PREP.length=0;
      novoPrep.forEach(s=>{ if(s) PREP.push(s); });
    }

    // Custos extras
    const custosSnap = await getDocs(collection(dbFs,'custos_extras'));
    CUSTOS_EXTRAS = [];
    custosSnap.forEach(d=>{ CUSTOS_EXTRAS.push({id:d.id, ...d.data()}); });

    // Gastos realizados (por destino/categoria)
    const gastosSnap = await getDocs(collection(dbFs,'gastos_realizados'));
    GASTOS_REALIZADOS = [];
    gastosSnap.forEach(d=>{ GASTOS_REALIZADOS.push({id:d.id, ...d.data()}); });
  }catch(e){
    console.error('Erro ao carregar do Firestore, usando dados locais:', e);
  }
}

async function semear(){
  try{
    await setDoc(doc(dbFs,'config','meta'), META);
    await setDoc(doc(dbFs,'config','paises_index'), {ordem: PAISES_INDEX});
    for(const id of PAISES_INDEX) await setDoc(doc(dbFs,'paises',id), PAISES_DB[id]);
    for(let i=0;i<VACINAS.length;i++) await setDoc(doc(dbFs,'vacinas',String(i)), VACINAS[i]);
    for(let i=0;i<PREP.length;i++) await setDoc(doc(dbFs,'prep',String(i)), PREP[i]);
    await setDoc(doc(dbFs,'config','prep_index'), {total: PREP.length});
  }catch(e){console.error('Erro ao semear Firestore:',e)}
}

(async()=>{
  await carregarDoFirestore();
  migrarDatasCidades();
  renderApp();
})();
